<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alza Project Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--alza:#f04e23;--alza-dark:#c93d18;--black:#141414;--bg:#f2f1ef;--border:#e0dedd;--text:#222;--muted:#888;--green:#3b6d11;--green-bg:#e6f5d4;--red:#a32d2d;--red-bg:#fce8e8;--orange:#b03000;--orange-bg:#fde8dc;--blue:#185fa5;--blue-bg:#dceefb}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* SETUP */
.setup{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.setup-box{background:#fff;border-radius:12px;border:0.5px solid var(--border);padding:32px;width:460px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.setup-logo{background:var(--alza);color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;padding:3px 10px;border-radius:4px;display:inline-block;margin-bottom:14px}
.setup-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;color:var(--black);margin-bottom:6px}
.setup-sub{font-size:12px;color:var(--muted);margin-bottom:20px;line-height:1.5}
.setup-note{background:#fff7f4;border:1px solid #fde8dc;border-radius:6px;padding:10px 12px;font-size:11px;color:#7a3000;margin-bottom:16px;line-height:1.5}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.f label{font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
.f input{padding:9px 11px;border:1.5px solid var(--border);border-radius:6px;font-family:'Barlow',sans-serif;font-size:13px;outline:none;transition:border-color .2s}
.f input:focus{border-color:var(--alza)}
.f .hint{font-size:10px;color:var(--muted)}

/* NAV */
.nav{background:var(--black);height:52px;padding:0 20px;display:none;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.nav-logo{background:var(--alza);color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:19px;padding:2px 9px;border-radius:4px;letter-spacing:1px}
.nav-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;color:#fff;flex:1}
.nav-date{font-size:11px;color:#555}
.btn{padding:7px 15px;border-radius:5px;border:none;cursor:pointer;font-family:'Barlow',sans-serif;font-weight:600;font-size:12px;transition:background .15s}
.btn-alza{background:var(--alza);color:#fff}.btn-alza:hover{background:var(--alza-dark)}
.btn-dark{background:#333;color:#fff}.btn-dark:hover{background:#444}
.btn-light{background:#fff;color:var(--black);border:1px solid var(--border)}.btn-light:hover{background:#f5f5f5}
.btn-red{background:var(--red-bg);color:var(--red)}.btn-red:hover{background:#f5c6c6}
.btn-back{display:none}

/* DASH */
#dash{display:none;padding:20px}
.dash-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:26px;color:var(--black);margin-bottom:4px}
.dash-sub{font-size:12px;color:var(--muted);margin-bottom:18px}
.stats{display:flex;gap:10px;margin-bottom:20px}
.stat{background:#fff;border-radius:8px;border:.5px solid var(--border);padding:12px 18px;flex:1;display:flex;align-items:center;gap:12px}
.stat-n{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:30px;line-height:1}
.stat-l{font-size:10px;color:var(--muted);font-weight:500;margin-top:2px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.pcard{background:#fff;border-radius:10px;border:.5px solid var(--border);overflow:hidden;cursor:pointer;transition:box-shadow .2s,transform .15s}
.pcard:hover{box-shadow:0 4px 18px rgba(0,0,0,.1);transform:translateY(-2px)}
.pcard-top{padding:13px 15px 11px;border-left:4px solid var(--alza);display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.pcard-top.on-track{border-color:#63a122}.pcard-top.at-risk{border-color:var(--alza)}.pcard-top.blocked{border-color:#e24b4a}.pcard-top.done{border-color:#bbb}
.pid{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.4px}
.pname{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;color:var(--black);margin-top:2px;line-height:1.2}
.psup{font-size:11px;color:var(--muted);margin-top:2px}
.spill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap;flex-shrink:0}
.sdot{width:6px;height:6px;border-radius:50%}
.s-on-track{background:var(--green-bg);color:var(--green)}.s-on-track .sdot{background:#63a122}
.s-at-risk{background:var(--orange-bg);color:var(--orange)}.s-at-risk .sdot{background:var(--alza)}
.s-blocked{background:var(--red-bg);color:var(--red)}.s-blocked .sdot{background:#e24b4a}
.s-done{background:#eee;color:#555}.s-done .sdot{background:#bbb}
.pprog{margin:0 15px 10px}
.ptrack{height:4px;background:#eee;border-radius:2px;overflow:hidden}
.pfill{height:100%;border-radius:2px;background:var(--alza);transition:width .4s}
.pfill.g{background:#63a122}
.pnums{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:2px}
.pbot{padding:8px 15px 11px;border-top:.5px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between}
.pmeta{font-size:10px;color:var(--muted)}
.obtn{font-size:10px;font-weight:600;color:var(--alza);border:1px solid var(--alza);border-radius:4px;padding:3px 9px;cursor:pointer;background:none;transition:background .15s}
.obtn:hover{background:var(--alza);color:#fff}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-icon{font-size:42px;margin-bottom:12px}
.empty-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;color:var(--black);margin-bottom:4px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:12px;width:660px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.25)}
.mhead{background:var(--black);color:#fff;padding:14px 18px;border-radius:12px 12px 0 0;display:flex;align-items:center;justify-content:space-between;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px}
.mclose{cursor:pointer;background:none;border:none;color:#fff;font-size:18px}
.mbody{padding:18px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.mg3{grid-template-columns:1fr 1fr 1fr}
.mf{display:flex;flex-direction:column;gap:4px}
.mf.full{grid-column:1/-1}
.mf label{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.mf input,.mf select,.mf textarea{padding:8px 10px;border:1.5px solid var(--border);border-radius:6px;font-family:'Barlow',sans-serif;font-size:12px;color:var(--text);outline:none;transition:border-color .2s;width:100%}
.mf input:focus,.mf select:focus,.mf textarea:focus{border-color:var(--alza)}
.mf textarea{resize:vertical;min-height:65px;line-height:1.5}
.mactions{display:flex;gap:8px;padding-top:14px;border-top:1px solid #eee;margin-top:4px}

/* ONEPAGER */
#op{display:none;padding:14px 20px}
.optb{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.bsm{padding:5px 13px;font-size:11px;border-radius:5px;border:none;cursor:pointer;font-family:'Barlow',sans-serif;font-weight:600;transition:background .15s}
.opgt{font-size:10px;color:var(--muted);margin-left:auto}
.ophdr{background:var(--alza);border-radius:8px;padding:11px 18px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ophl{display:flex;align-items:center;gap:12px}
.oplogo{background:#fff;color:var(--alza);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;padding:2px 10px;border-radius:4px;letter-spacing:1px}
.optitle{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;color:#fff}
.opsub{font-size:11px;color:rgba(255,255,255,.75);margin-top:2px}
.opright{text-align:right}
.opbadge{display:inline-block;padding:3px 12px;border-radius:4px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;background:rgba(255,255,255,.2);color:#fff}
.opbadge.on-track{background:rgba(99,161,34,.35)}.opbadge.at-risk{background:rgba(220,80,0,.4)}.opbadge.blocked{background:rgba(180,30,30,.45)}.opbadge.done{background:rgba(255,255,255,.25)}
.opmeta{font-size:10px;color:rgba(255,255,255,.65);margin-top:4px}
.opgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opc{background:#fff;border-radius:8px;border:.5px solid var(--border);overflow:hidden;display:flex;flex-direction:column}
.opch{color:#fff;padding:6px 12px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:.8px;text-transform:uppercase}
.h1{background:#f04e23}.h2{background:#d93e15}.h3{background:#b83410}.h4{background:#a32d2d}.h5{background:#c44010}.h6{background:#e05520}
.opcb{padding:10px 12px;flex:1;font-size:11px;line-height:1.55}
.ir{display:flex;gap:5px;margin-bottom:4px}
.il{color:var(--muted);font-size:10px;min-width:78px;font-weight:500}
.iv{font-size:11px;font-weight:500;color:var(--black)}
.bdg{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600}
.bg{background:var(--green-bg);color:var(--green)}.br{background:var(--red-bg);color:var(--red)}.bo{background:var(--orange-bg);color:var(--orange)}.bgy{background:#eee;color:#555}
.sep{border-top:.5px solid #eee;margin:7px 0}
.mr{display:flex;align-items:center;gap:7px;padding:4px 0;border-bottom:.5px solid #f0f0f0}
.mr:last-child{border-bottom:none}
.md{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.mn{font-weight:500;font-size:11px;flex:1}
.mdt{font-size:10px;color:var(--muted);white-space:nowrap}
.bl{display:flex;gap:7px;padding:3px 0;border-bottom:.5px solid #f0f0f0;align-items:flex-start}
.bl:last-child{border-bottom:none}
.bld{width:5px;height:5px;border-radius:50%;background:var(--alza);margin-top:4px;flex-shrink:0}
.blt{font-size:11px;flex:1;line-height:1.4}
.bldt{font-size:10px;color:var(--muted);white-space:nowrap}
.rsk{border-left:3px solid #e24b4a;padding:4px 7px;margin-bottom:5px;background:#fef8f8;border-radius:0 4px 4px 0;font-size:11px;line-height:1.4}
.rsk.w{border-color:var(--alza);background:#fff7f4}
.pb{display:flex;gap:3px;margin-top:7px}
.ps{flex:1;height:5px;border-radius:2px}
.ps-d{background:#63a122}.ps-a{background:var(--alza)}.ps-t{background:#ddd}
.pl{display:flex;gap:10px;margin-top:4px;font-size:9px;color:var(--muted)}
.ld{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:2px;vertical-align:middle}
.opfoot{text-align:right;font-size:9px;color:#bbb;margin-top:7px}

/* INDICATOR */
.ind{position:fixed;bottom:18px;right:18px;padding:9px 16px;border-radius:8px;font-size:12px;font-weight:600;display:none;z-index:300;box-shadow:0 4px 14px rgba(0,0,0,.15);align-items:center;gap:7px}
.ind.saving{display:flex;background:var(--black);color:#fff}
.ind.saved{display:flex;background:var(--green-bg);color:var(--green)}
.ind.error{display:flex;background:var(--red-bg);color:var(--red)}
.spin{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media print{.nav,.optb,.ind{display:none!important}#op{padding:0}body{background:#fff}}
</style>
</head>
<body>

<!-- SETUP -->
<div class="setup" id="setupScreen">
  <div class="setup-box">
    <span class="setup-logo">ALZA</span>
    <div class="setup-title">Project Dashboard</div>
    <div class="setup-sub">Zadaj GitHub údaje pre zdieľané ukladanie projektov. Robí sa len raz.</div>
    <div class="setup-note">🔒 Token sa ukladá len lokálne v tvojom prehliadači. Nikdy sa neposiela nikam inam ako na GitHub API.</div>
    <div class="f"><label>GitHub Username</label><input id="s_user" placeholder="Radoslav-PM"></div>
    <div class="f"><label>GitHub Repo</label><input id="s_repo" placeholder="alza-dashboard"></div>
    <div class="f"><label>Personal Access Token (scope: repo)</label><input id="s_token" type="password" placeholder="ghp_..."><span class="hint">github.com/settings/tokens</span></div>
    <button class="btn btn-alza" style="width:100%;padding:10px;" onclick="saveSettings()">▶ Spustiť Dashboard</button>
  </div>
</div>

<!-- NAV -->
<nav class="nav" id="nav">
  <span class="nav-logo">ALZA</span>
  <span class="nav-title" id="navTitle">Project Dashboard</span>
  <span class="nav-date" id="navDate"></span>
  <button class="btn btn-dark btn-back" id="btnBack" onclick="showDash()">← Dashboard</button>
  <button class="btn btn-alza" onclick="openAdd()">+ Pridať projekt</button>
  <button class="btn btn-dark" style="font-size:15px;padding:6px 10px;" onclick="openSetup()" title="Nastavenia">⚙</button>
</nav>

<!-- DASH -->
<div id="dash">
  <div style="padding:20px;" id="dashInner">
    <div style="text-align:center;padding:50px;color:var(--muted)"><span class="spin" style="font-size:28px;">⟳</span><div style="margin-top:12px;font-size:13px;">Načítavam...</div></div>
  </div>
</div>

<!-- ONEPAGER -->
<div id="op">
  <div class="optb">
    <button class="bsm btn-dark" onclick="openEdit()">✏ Upraviť</button>
    <button class="bsm btn-light" onclick="window.print()">🖨 PDF</button>
    <button class="bsm btn-red" onclick="delProj()">✕ Odstrániť</button>
    <span class="opgt" id="opgt"></span>
  </div>
  <div id="opContent"></div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="mhead"><span id="mTitle">Nový projekt</span><button class="mclose" onclick="closeModal()">✕</button></div>
    <div class="mbody">
      <div class="mg">
        <div class="mf"><label>Projekt ID</label><input id="m_id" placeholder="PROJ12345"></div>
        <div class="mf"><label>Názov</label><input id="m_name" placeholder="AutoStore"></div>
        <div class="mf"><label>Dodávateľ</label><input id="m_supplier" placeholder="Element Logic"></div>
        <div class="mf"><label>PM / Owner</label><input id="m_owner" placeholder="Meno Priezvisko"></div>
      </div>
      <div class="mg mg3">
        <div class="mf"><label>Status</label><select id="m_status"><option value="on-track">🟢 On Track</option><option value="at-risk">🟠 At Risk</option><option value="blocked">🔴 Blocked</option><option value="done">⚪ Done</option></select></div>
        <div class="mf"><label>Fáza</label><input id="m_phase" placeholder="Implementácia"></div>
        <div class="mf"><label>Due Date</label><input id="m_due" placeholder="31.12.2025"></div>
      </div>
      <div class="mg">
        <div class="mf"><label>Oddelenie</label><input id="m_dept" placeholder="PROC / IT"></div>
        <div class="mf"><label>Dátum statusu</label><input id="m_statusdate" placeholder="22.5.2026"></div>
      </div>
      <div class="mg"><div class="mf full"><label>Summary (z Asany — skopíruj text)</label><textarea id="m_summary" rows="5" placeholder="• Popis stavu..."></textarea></div></div>
      <div class="mg"><div class="mf full"><label>Mílniky (Názov | Dátum | done/active/risk/planned)</label><textarea id="m_milestones" rows="4" placeholder="Handover|15.5.|done&#10;Školenie|13.5.|active"></textarea></div></div>
      <div class="mg">
        <div class="mf"><label>Riziká</label><textarea id="m_risks" rows="3" placeholder="Riziko 1&#10;Riziko 2"></textarea></div>
        <div class="mf"><label>Otvorené body</label><textarea id="m_open" rows="3" placeholder="Bod 1&#10;Bod 2"></textarea></div>
      </div>
      <div class="mg">
        <div class="mf"><label>Plánované činnosti (Názov | Dátum)</label><textarea id="m_planned" rows="3" placeholder="Školenie|13.5.&#10;Handover|15.5."></textarea></div>
        <div class="mf"><label>HW / Budget (Názov | done/delayed/pending)</label><textarea id="m_hw" rows="3" placeholder="Tlačiarne|done&#10;Skenery|delayed"></textarea></div>
      </div>
      <div class="mg">
        <div class="mf"><label>Postup projektu (%)</label><input id="m_progress" type="number" min="0" max="100" value="0"></div>
      </div>
      <div class="mactions">
        <button class="btn btn-alza" onclick="saveProj()">💾 Uložiť na GitHub</button>
        <button class="btn btn-light" onclick="closeModal()">Zrušiť</button>
      </div>
    </div>
  </div>
</div>

<div class="ind" id="ind"></div>

<script>
var GU='',GR='',GT='',FILE='projects.json';
var projects=[],sha=null,editId=null,curId=null;

function loadCfg(){GU=localStorage.getItem('gu')||'';GR=localStorage.getItem('gr')||'';GT=localStorage.getItem('gt')||'';return GU&&GR&&GT;}
function saveCfg(){GU=document.getElementById('s_user').value.trim();GR=document.getElementById('s_repo').value.trim();GT=document.getElementById('s_token').value.trim();if(!GU||!GR||!GT){alert('Vyplň všetky polia');return;}localStorage.setItem('gu',GU);localStorage.setItem('gr',GR);localStorage.setItem('gt',GT);startApp();}
function openSetup(){document.getElementById('setupScreen').style.display='flex';document.getElementById('nav').style.display='none';document.getElementById('dash').style.display='none';document.getElementById('op').style.display='none';document.getElementById('s_user').value=GU;document.getElementById('s_repo').value=GR;}

var apiUrl=function(){return 'https://api.github.com/repos/'+GU+'/'+GR+'/contents/'+FILE;};
var hdrs=function(){return{'Authorization':'Bearer '+GT,'Content-Type':'application/json','Accept':'application/vnd.github+json'};};

async function loadGH(){
  try{
    var r=await fetch(apiUrl(),{headers:hdrs()});
    if(r.status===404){projects=[];sha=null;return true;}
    if(!r.ok)throw new Error('HTTP '+r.status);
    var d=await r.json();sha=d.sha;
    projects=JSON.parse(atob(d.content.replace(/\n/g,'')));
    return true;
  }catch(e){showInd('error','Chyba: '+e.message);return false;}
}

async function saveGH(){
  showInd('saving','↻ Ukladám...');
  try{
    var content=btoa(unescape(encodeURIComponent(JSON.stringify(projects,null,2))));
    var body={message:'Update '+new Date().toISOString(),content:content};
    if(sha)body.sha=sha;
    var r=await fetch(apiUrl(),{method:'PUT',headers:hdrs(),body:JSON.stringify(body)});
    if(!r.ok){var e=await r.json();throw new Error(e.message||r.status);}
    var d=await r.json();sha=d.content.sha;
    showInd('saved','✓ Uložené');return true;
  }catch(e){showInd('error','Chyba: '+e.message);return false;}
}

var indT;
function showInd(type,text){
  clearTimeout(indT);
  var el=document.getElementById('ind');
  el.className='ind '+type;
  el.innerHTML=type==='saving'?'<span class="spin">⟳</span> '+text:text;
  if(type!=='saving')indT=setTimeout(function(){el.className='ind';},3000);
}

var SL={'on-track':'On Track','at-risk':'At Risk','blocked':'Blocked','done':'Done'};

function showDash(){
  document.getElementById('op').style.display='none';
  document.getElementById('dash').style.display='block';
  document.getElementById('btnBack').style.display='none';
  document.getElementById('navTitle').textContent='Project Dashboard';
  renderDash();
}

function renderDash(){
  var ot=projects.filter(function(p){return p.status==='on-track';}).length;
  var ar=projects.filter(function(p){return p.status==='at-risk';}).length;
  var bl=projects.filter(function(p){return p.status==='blocked';}).length;
  var dn=projects.filter(function(p){return p.status==='done';}).length;

  var html='<div style="padding:0 0 18px"><div class="dash-title">Projektový Dashboard</div><div class="dash-sub">Alza.cz · '+GU+'/'+GR+'</div></div>';
  html+='<div class="stats">';
  html+='<div class="stat"><span style="font-size:22px">📋</span><div><div class="stat-n">'+projects.length+'</div><div class="stat-l">Celkom</div></div></div>';
  html+='<div class="stat"><span style="font-size:22px">🟢</span><div><div class="stat-n" style="color:#3b6d11">'+ot+'</div><div class="stat-l">On Track</div></div></div>';
  html+='<div class="stat"><span style="font-size:22px">🟠</span><div><div class="stat-n" style="color:#b03000">'+ar+'</div><div class="stat-l">At Risk</div></div></div>';
  html+='<div class="stat"><span style="font-size:22px">🔴</span><div><div class="stat-n" style="color:#a32d2d">'+bl+'</div><div class="stat-l">Blocked</div></div></div>';
  html+='<div class="stat"><span style="font-size:22px">✅</span><div><div class="stat-n" style="color:#888">'+dn+'</div><div class="stat-l">Done</div></div></div>';
  html+='</div>';

  if(projects.length===0){
    html+='<div class="empty"><div class="empty-icon">📁</div><div class="empty-title">Žiadne projekty</div><div style="font-size:12px;color:var(--muted);margin-top:4px;">Klikni "+ Pridať projekt"</div></div>';
  } else {
    html+='<div class="pgrid">';
    projects.forEach(function(p){
      html+='<div class="pcard" onclick="showOP(\''+p.id+'\')">';
      html+='<div class="pcard-top '+p.status+'">';
      html+='<div><div class="pid">'+p.id+' · '+(p.dept||'')+'</div><div class="pname">'+p.name+'</div><div class="psup">'+p.supplier+' · '+p.owner+'</div></div>';
      html+='<span class="spill s-'+p.status+'"><span class="sdot"></span>'+SL[p.status]+'</span></div>';
      html+='<div class="pprog"><div class="ptrack"><div class="pfill'+(p.status==='on-track'||p.status==='done'?' g':'')+'" style="width:'+(p.progress||0)+'%"></div></div>';
      html+='<div class="pnums"><span>'+( p.progress||0)+'%</span><span>Due: '+p.due+'</span></div></div>';
      html+='<div class="pbot"><span class="pmeta">'+p.statusdate+' · '+p.phase+'</span>';
      html+='<button class="obtn" onclick="event.stopPropagation();showOP(\''+p.id+'\')">Otvoriť →</button></div></div>';
    });
    html+='</div>';
  }
  document.getElementById('dashInner').innerHTML=html;
}

function showOP(id){
  curId=id;
  var p=projects.find(function(x){return x.id===id;});
  if(!p)return;
  document.getElementById('dash').style.display='none';
  document.getElementById('op').style.display='block';
  document.getElementById('btnBack').style.display='inline-block';
  document.getElementById('navTitle').textContent=p.id+' — '+p.name;
  document.getElementById('opgt').textContent='Vygenerované: '+new Date().toLocaleString('sk-SK');

  var msC={done:{c:'#63a122',b:'<span class="bdg bg" style="font-size:9px;">Done</span>'},active:{c:'#f04e23',b:'<span class="bdg bo" style="font-size:9px;">Prebieha</span>'},risk:{c:'#e24b4a',b:'<span class="bdg br" style="font-size:9px;">Ohrozené</span>'},planned:{c:'#bbb',b:'<span class="bdg bgy" style="font-size:9px;">Plánované</span>'}};
  var hwB={done:'<span class="bdg bg" style="font-size:9px;">DONE</span>',delayed:'<span class="bdg br" style="font-size:9px;">ONESKORENÉ</span>',pending:'<span class="bdg bo" style="font-size:9px;">ČAKÁ</span>'};
  var stL={'on-track':'🟢 ON TRACK','at-risk':'🟠 AT RISK','blocked':'🔴 BLOCKED','done':'⚪ DONE'};

  function pL(s){return (s||'').split('\n').map(function(l){return l.trim();}).filter(Boolean).map(function(l){return l.split('|').map(function(x){return x.trim();});});}

  var ms=pL(p.milestones),hw=pL(p.hw),pl=pL(p.planned),op=pL(p.open),rk=pL(p.risks);

  var sumH=(p.summary||'').split('\n').map(function(l){
    l=l.trim();if(!l)return'';
    if(/^[•\-\*]/.test(l))return'<div class="bl"><span class="bld"></span><span class="blt">'+l.replace(/^[•\-\*]\s*/,'')+'</span></div>';
    return'<div style="font-size:11px;margin-bottom:3px;line-height:1.5;">'+l+'</div>';
  }).join('');

  var pct=p.progress||0,dn=Math.round(pct/10),td=Math.max(10-dn-1,0);

  var h='<div class="ophdr"><div class="ophl"><span class="oplogo">ALZA</span><div><div class="optitle">'+p.id+' — '+p.name+'</div><div class="opsub">Dodávateľ: '+p.supplier+' | Fáza: '+p.phase+' | Due: '+p.due+'</div></div></div>';
  h+='<div class="opright"><div class="opbadge '+p.status+'">'+stL[p.status]+'</div><div class="opmeta">Status: '+p.statusdate+' | Owner: '+p.owner+'</div></div></div>';
  h+='<div class="opgrid">';

  // Card 1
  h+='<div class="opc"><div class="opch h1">1 — Základné info</div><div class="opcb">';
  h+='<div class="ir"><span class="il">Projekt</span><span class="iv">'+p.id+'</span></div>';
  h+='<div class="ir"><span class="il">Dodávateľ</span><span class="iv">'+p.supplier+'</span></div>';
  h+='<div class="ir"><span class="il">Fáza</span><span class="iv"><span class="bdg bo">'+p.phase+'</span></span></div>';
  h+='<div class="ir"><span class="il">Stav</span><span class="iv"><span class="bdg '+(p.status==='on-track'?'bg':p.status==='blocked'?'br':'bo')+'">'+stL[p.status]+'</span></span></div>';
  h+='<div class="sep"></div>';
  h+='<div class="ir"><span class="il">Owner</span><span class="iv">'+p.owner+'</span></div>';
  h+='<div class="ir"><span class="il">Oddelenie</span><span class="iv">'+(p.dept||'—')+'</span></div>';
  h+='<div class="ir"><span class="il">Due Date</span><span class="iv">'+p.due+'</span></div>';
  h+='<div class="ir"><span class="il">Status date</span><span class="iv">'+p.statusdate+'</span></div>';
  h+='</div></div>';

  // Card 2
  h+='<div class="opc"><div class="opch h2">2 — Mílniky</div><div class="opcb">';
  h+='<div style="font-size:10px;color:var(--muted);font-weight:500;margin-bottom:5px;">HLAVNÉ MÍLNIKY</div>';
  if(ms.length){ms.forEach(function(m){var s=msC[m[2]]||msC.planned;h+='<div class="mr"><span class="md" style="background:'+s.c+'"></span><span class="mn">'+m[0]+'</span><span class="mdt">'+(m[1]||'')+'</span>'+s.b+'</div>';});}
  else h+='<div style="color:#bbb;font-size:11px;">—</div>';
  h+='</div></div>';

  // Card 3
  h+='<div class="opc"><div class="opch h3">3 — Budget / HW</div><div class="opcb">';
  h+='<div style="font-size:10px;color:var(--muted);font-weight:500;margin-bottom:5px;">HW DODÁVKY</div>';
  if(hw.length){hw.forEach(function(x){h+='<div class="bl"><span class="bld"></span><span class="blt">'+x[0]+'</span>'+(hwB[x[1]]||'')+'</div>';});}
  else h+='<div style="color:#bbb;font-size:11px;">—</div>';
  h+='</div></div>';

  // Card 4
  h+='<div class="opc"><div class="opch h4">4 — Summary</div><div class="opcb">';
  h+='<div style="font-size:10px;color:var(--muted);font-weight:500;margin-bottom:5px;">ASANA STATUS — '+p.statusdate+'</div>';
  h+=sumH||'<div style="color:#bbb;font-size:11px;">—</div>';
  if(rk.length){h+='<div class="sep"></div><div style="font-size:10px;color:var(--muted);font-weight:500;margin-bottom:4px;">RIZIKÁ</div>';rk.forEach(function(r){h+='<div class="rsk w">'+r[0]+'</div>';});}
  h+='</div></div>';

  // Card 5
  h+='<div class="opc"><div class="opch h5">5 — Plánované</div><div class="opcb">';
  if(pl.length){pl.forEach(function(x){h+='<div class="bl"><span class="bld"></span><span class="blt">'+x[0]+'</span><span class="bldt">'+(x[1]||'')+'</span></div>';});}
  else h+='<div style="color:#bbb;font-size:11px;">—</div>';
  h+='<div class="sep"></div>';
  h+='<div style="font-size:10px;color:var(--muted);font-weight:500;margin-bottom:3px;">Postup — '+pct+'%</div>';
  h+='<div class="pb"><div class="ps ps-d" style="flex:'+dn+'"></div><div class="ps ps-a" style="flex:1"></div><div class="ps ps-t" style="flex:'+td+'"></div></div>';
  h+='<div class="pl"><span><span class="ld" style="background:#63a122"></span>Hotovo</span><span><span class="ld" style="background:#f04e23"></span>Prebieha</span><span><span class="ld" style="background:#ddd"></span>Zostatok</span></div>';
  h+='</div></div>';

  // Card 6
  h+='<div class="opc"><div class="opch h6">6 — Otvorené body</div><div class="opcb">';
  if(op.length){op.forEach(function(o,i){h+='<div class="bl"><span class="bdg bo" style="font-size:9px;min-width:18px;text-align:center;">'+(i+1)+'</span><span class="blt" style="margin-left:4px;">'+o[0]+'</span></div>';});}
  else h+='<div style="color:#bbb;font-size:11px;">—</div>';
  h+='</div></div>';

  h+='</div><div class="opfoot">'+p.id+' · '+p.name+' · Alza.cz · '+new Date().toLocaleDateString('sk-SK')+' · Dôverné</div>';
  document.getElementById('opContent').innerHTML=h;
}

function openAdd(){editId=null;document.getElementById('mTitle').textContent='Nový projekt';['id','name','supplier','owner','phase','due','dept','statusdate','summary','milestones','risks','open','planned','hw'].forEach(function(f){document.getElementById('m_'+f).value='';});document.getElementById('m_status').value='on-track';document.getElementById('m_progress').value='0';document.getElementById('overlay').classList.add('on');}
function openEdit(){var p=projects.find(function(x){return x.id===curId;});if(!p)return;editId=p.id;document.getElementById('mTitle').textContent='Upraviť — '+p.id;['id','name','supplier','owner','phase','due','dept','statusdate','summary','milestones','risks','open','planned','hw'].forEach(function(f){var el=document.getElementById('m_'+f);if(el)el.value=p[f]||'';});document.getElementById('m_status').value=p.status||'on-track';document.getElementById('m_progress').value=p.progress||0;document.getElementById('overlay').classList.add('on');}
function closeModal(){document.getElementById('overlay').classList.remove('on');}

async function saveProj(){
  var p={id:document.getElementById('m_id').value.trim(),name:document.getElementById('m_name').value.trim(),supplier:document.getElementById('m_supplier').value.trim(),owner:document.getElementById('m_owner').value.trim(),status:document.getElementById('m_status').value,phase:document.getElementById('m_phase').value.trim(),due:document.getElementById('m_due').value.trim(),dept:document.getElementById('m_dept').value.trim(),statusdate:document.getElementById('m_statusdate').value.trim(),progress:parseInt(document.getElementById('m_progress').value)||0,summary:document.getElementById('m_summary').value,milestones:document.getElementById('m_milestones').value,risks:document.getElementById('m_risks').value,open:document.getElementById('m_open').value,planned:document.getElementById('m_planned').value,hw:document.getElementById('m_hw').value};
  if(!p.id||!p.name){alert('Vyplň Projekt ID a Názov');return;}
  if(editId){var i=projects.findIndex(function(x){return x.id===editId;});if(i>-1)projects[i]=p;}else{projects.unshift(p);}
  closeModal();
  var ok=await saveGH();
  if(ok){if(editId)showOP(p.id);else showDash();}
}

async function delProj(){
  if(!confirm('Odstrániť projekt?'))return;
  projects=projects.filter(function(x){return x.id!==curId;});
  var ok=await saveGH();if(ok)showDash();
}

async function startApp(){
  document.getElementById('setupScreen').style.display='none';
  document.getElementById('nav').style.display='flex';
  document.getElementById('dash').style.display='block';
  document.getElementById('op').style.display='none';
  document.getElementById('navDate').textContent=new Date().toLocaleDateString('sk-SK',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  var ok=await loadGH();if(ok)renderDash();
}

document.getElementById('overlay').addEventListener('click',function(e){if(e.target===document.getElementById('overlay'))closeModal();});
if(loadCfg())startApp();
</script>
